<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>md Novel</title>
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body>
    <aside id="lateral">
      <header id="livro">
        <p class="rotulo">Livro</p>
        <h1 id="nome-do-livro">md Novel</h1>
        <p id="resumo-do-livro"></p>
      </header>
      <nav aria-label="Capítulos">
        <ol id="capitulos"></ol>
      </nav>
      <footer>
        <button id="abrir-pasta" type="button">Abrir pasta…</button>
      </footer>
    </aside>
    <main>
      <header id="barra">
        <button id="alternar-lateral" type="button" title="Esconder ou mostrar a lateral (F9)" aria-label="Esconder ou mostrar a lateral" aria-pressed="false">☰</button>
        <div id="capitulo">
          <span id="nome-do-capitulo"></span>
          <span id="arquivo-do-capitulo"></span>
        </div>
        <div id="acoes">
          <button id="tema" type="button" title="Trocar o tema: do sistema, claro ou escuro">Tema: sistema</button>
          <button id="maquina" type="button" title="Máquina de escrever: a linha em que você escreve fica no meio da tela (F10)" aria-pressed="false">Máquina</button>
          <button id="foco" type="button" title="Modo foco: só a folha na tela (F8). Tela cheia: F11">Foco</button>
          <button id="exportar" type="button" disabled>Exportar .docx…</button>
          <button id="salvar" type="button" disabled>Salvar</button>
        </div>
      </header>
      <div id="avisos"></div>
      <div id="mesa">
        <div id="vazio">
          <p id="texto-do-vazio">Abra a pasta onde ficam os capítulos do livro.</p>
          <button id="abrir-pasta-do-vazio" type="button">Abrir pasta…</button>
        </div>
        <div id="folha" hidden></div>
      </div>
      <footer id="status">
        <span id="palavras-do-capitulo"></span>
        <span id="palavras-da-selecao"></span>
        <span id="palavras-do-livro"></span>
        <span id="estado" role="status"></span>
        <button id="aspas" type="button" aria-pressed="true" title="Aspas curvas e travessão ao digitar: &quot; vira “ ”, ' vira ‘ ’ e -- vira —. Clique para desligar ou ligar">Aspas “ ”</button>
        <button id="zoom" type="button" title="Zoom da janela: Ctrl+rolagem, Ctrl+= e Ctrl+-. Clique aqui ou Ctrl+0 para voltar a 100%">100%</button>
      </footer>
    </main>
    <button id="sair-do-foco" type="button" title="Sair do modo foco (Esc ou F8)" hidden>Sair do foco</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
