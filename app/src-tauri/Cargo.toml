[package]
name = "md-novel-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "O programa de desktop: adaptador fino entre a janela e os crates workspace e estilo."

[[bin]]
name = "md-novel-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
estilo.workspace = true
exportar.workspace = true
workspace.workspace = true
serde.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# O corretor ortográfico (ADR 0003): ligar a correção do WebKitGTK pede a API
# dele. É a mesma versão que o Tauri já traz, travada, para o tipo do WebView
# ser o mesmo dos dois lados. No Mac o WebView do sistema já corrige.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true

[lints]
workspace = true
