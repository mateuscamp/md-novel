[package]
name = "md-novel-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "O programa de desktop: adaptador fino entre a janela e os crates workspace e estilo."

[[bin]]
name = "md-novel-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
estilo.workspace = true
exportar.workspace = true
workspace.workspace = true
serde.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true

[lints]
workspace = true
